# 复制为 android/config.properties 后填自己的地址（该文件已被 .gitignore 忽略）
# 公网地址（必须 HTTPS，手机麦克风才可用）
base=https://media.example.com/
# 局域网地址（在家时优先使用，速度明显更快）
lan=http://192.168.1.10:8097/
# 访问账号（对应服务端 MEDIA_WEB_USER / MEDIA_WEB_PASSWORD）
user=media
pass=change-me
# 应用内"检查更新"读取的 JSON 地址（可选）
update=https://example.com/mc-latest.json
